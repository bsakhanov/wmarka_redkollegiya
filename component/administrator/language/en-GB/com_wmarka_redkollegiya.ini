COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF="Proofreading"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_DESC="The Proofread button in the editor shows findings and applies only the accepted ones, by place and verbatim quote. Only the mechanical part of the Russian Redkollegiya layers: what search and counting can check. Meaning, commas and facts are for a model and an editor. No AI tokens are spent."
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_SLOP="AI traces and clichés"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_SLOP_DESC="Slopotron: chatbot traces (internal references, answer frames), cliché phrases, and a flock of markers in a paragraph."
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_SLOP_WORDS="Marker words"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_SLOP_WORDS_DESC="Slopotron does not apply them to news, science or legal text: there they are the norm of the genre."
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_SLOP_WORDS_EXCEPT_NEWS="Except news categories"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_SLOP_WORDS_ALWAYS="In all articles"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_SLOP_WORDS_NEVER="Do not check"
COM_WMARKA_REDKOLLEGIYA_CONFIG_NEWS_CATEGORIES="News categories"
COM_WMARKA_REDKOLLEGIYA_CONFIG_NEWS_CATEGORIES_DESC="Marker words are not checked in articles of these categories. The category comes from the article form."
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_KANC="Officialese"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_KANC_DESC="Pass A of the language methodology and Chukovsky. Where the fix is unambiguous it is offered. Text inside «quotes» is not checked: a speaker's words are not edited."
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_ROZENTAL="Norm by closed lists"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_ROZENTAL_DESC="Rozental: government after «согласно», «в течение», «по окончании», «несмотря на», «вследствие», «оплатить что», doubled words."
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_RHYTHM="Rhythm"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_RHYTHM_DESC="Five or more sentences in a row of almost the same length (spread under three words): a monotonous rhythm."
