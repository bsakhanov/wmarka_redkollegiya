COM_WMARKA_REDKOLLEGIYA_LAYER_CHUKOVSKY="Officialese and rhythm (Chukovsky, methodology)"
COM_WMARKA_REDKOLLEGIYA_LAYER_ROZENTAL="Norm (Rozental)"
COM_WMARKA_REDKOLLEGIYA_LAYER_YO="The letter ё"
COM_WMARKA_REDKOLLEGIYA_PROOF_S_CITE="Chatbot trace: an internal source reference (ChatGPT, Gemini, Grok, DeepSeek, Perplexity). People never type this — remove it."
COM_WMARKA_REDKOLLEGIYA_PROOF_S_TOKEN="A language-model service token leaked through copy and paste — remove it."
COM_WMARKA_REDKOLLEGIYA_PROOF_S_PUA="An invisible chatbot quote wrapper — remove it."
COM_WMARKA_REDKOLLEGIYA_PROOF_S_ENT="An HTML entity instead of the character — a failed paste from a chat. Replace it with the character."
COM_WMARKA_REDKOLLEGIYA_PROOF_S_FRAME="A chatbot answer frame («Конечно, вот…», «Надеюсь, было полезно») — dialogue leftover, not article text."
COM_WMARKA_REDKOLLEGIYA_PROOF_S_SMM="A social-media call («делитесь в комментариях») — most likely out of place in an article."
COM_WMARKA_REDKOLLEGIYA_PROOF_S_PHR="An AI cliché (Slopotron). One is fine; the trouble is a flock."
COM_WMARKA_REDKOLLEGIYA_PROOF_S_WORD="An AI marker word (Slopotron): an empty intensifier or officialese. One is fine, three in a paragraph is a flock."
COM_WMARKA_REDKOLLEGIYA_PROOF_S_CLUSTER="This paragraph has %d officialese and cliché markers — a flock (Slopotron). Rewrite the paragraph as a whole rather than word by word."
COM_WMARKA_REDKOLLEGIYA_PROOF_K_YAVL="«Является» is an officialese link verb: use «есть», a dash or a direct verb."
COM_WMARKA_REDKOLLEGIYA_PROOF_K_DANN="«Данный» is officialese: «этот»."
COM_WMARKA_REDKOLLEGIYA_PROOF_K_POZV="«Позволяет» is officialese: «даёт» or a direct verb."
COM_WMARKA_REDKOLLEGIYA_PROOF_K_OSUSH="«Осуществлять» is officialese: name the action directly."
COM_WMARKA_REDKOLLEGIYA_PROOF_K_RAMK="«В рамках», «в контексте», «в свете» are calques: say it simpler or rebuild the phrase."
COM_WMARKA_REDKOLLEGIYA_PROOF_K_PREDST="«Представляет собой», «выступает в роли», «характеризуется» are officialese: a simple verb or a dash."
COM_WMARKA_REDKOLLEGIYA_PROOF_K_UDEL="«Уделять внимание» is officialese: use a direct verb."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_SOGL="«Согласно», «благодаря», «вопреки» take the dative: согласно приказу."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_TECH="For time, «в течение» (года, месяца); «в течении» is about a river's flow."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_VVIDU="The preposition «ввиду» (because of) is written as one word; «в виду» only in «иметь в виду»."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_NESM="The preposition «несмотря на» is written as one word."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_PO="«По» meaning «after» takes the prepositional case: по окончании, по приезде."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_VSLED="The preposition «вследствие» (because of) ends in «е»."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_OPLAT="Оплатить что, without «за»; заплатить за что."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_DOUBLE="A word is repeated twice in a row — probably a typo."
COM_WMARKA_REDKOLLEGIYA_PROOF_Y_VSE="Here it is «всё»: всё равно, всё ещё, всё больше."
COM_WMARKA_REDKOLLEGIYA_PROOF_Y_NEM="Here it is «нём»: о нём, в нём, на нём."
COM_WMARKA_REDKOLLEGIYA_PROOF_Y_OBEM="«Объём» takes ё; without it the word is a form of the verb «объесть»."
COM_WMARKA_REDKOLLEGIYA_PROOF_Y_SCHET="«Счёт» takes ё: за счёт."
COM_WMARKA_REDKOLLEGIYA_PROOF_RH_MONO="Monotonous rhythm: %d sentences of almost the same length (spread %s words). Alternate long and short sentences by meaning (Chukovsky)."
COM_WMARKA_REDKOLLEGIYA_PROOF_OTHER_LANG="Proofreading works on Russian and Kazakh text; this article is in another language."
COM_WMARKA_REDKOLLEGIYA_PROOF_NONE="Proofreading: nothing to report."
COM_WMARKA_REDKOLLEGIYA_PROOF_FOUND="Findings: %d."
COM_WMARKA_REDKOLLEGIYA_PROOF_DONE="Proofreading: %d applied, %d declined, %d not applied (the text there changed or the quote occurs more than once)."
COM_WMARKA_REDKOLLEGIYA_PROOF_JOURNAL_ROW="proofreading: %d accepted, %d declined"
COM_WMARKA_REDKOLLEGIYA_PROOF_TOTALS="Proofreading, last 30 days: %d runs, %d findings accepted, %d declined."
COM_WMARKA_REDKOLLEGIYA_PROOF_TOTALS_DECLINED="Declined more often than accepted:"
