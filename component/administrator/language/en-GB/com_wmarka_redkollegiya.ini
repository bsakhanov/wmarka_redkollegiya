COM_WMARKA_REDKOLLEGIYA_CONFIG_RU="Russian text"
COM_WMARKA_REDKOLLEGIYA_CONFIG_RU_DESC="Based on the Milchin typograph: only rules whose right answer does not depend on the meaning of the sentence. These are the points where publications differ."
COM_WMARKA_REDKOLLEGIYA_CONFIG_PERCENT="Percent sign"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PERCENT_DESC="«10%» joined, as most business media write it, or «10 %» with a no-break space, as GOST and Milchin's handbook prescribe for scientific texts."
COM_WMARKA_REDKOLLEGIYA_CONFIG_PERCENT_SLIT="Joined: 10%"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PERCENT_NBSP="No-break space: 10 %"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PREP="Prepositions and conjunctions"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PREP_DESC="A no-break space keeps a short word on the same line as the next one. One-letter words follow Milchin; adding two- and three-letter ones gives more even lines but a denser text."
COM_WMARKA_REDKOLLEGIYA_CONFIG_PREP_ONE="One-letter: в, к, с, у, о, и, а, я"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PREP_SHORT="Also two- and three-letter: на, по, для, при…; particles же, ли, бы"
COM_WMARKA_REDKOLLEGIYA_CONFIG_INITIALS="Initials"
COM_WMARKA_REDKOLLEGIYA_CONFIG_INITIALS_DESC="«А. С. Пушкин» with no-break spaces keeps the initials with the surname. «As written» leaves initials alone."
COM_WMARKA_REDKOLLEGIYA_CONFIG_INITIALS_NBSP="А. С. Пушкин, with no-break spaces"
COM_WMARKA_REDKOLLEGIYA_CONFIG_INITIALS_KEEP="As written"
COM_WMARKA_REDKOLLEGIYA_CONFIG_EN_DASH="En dash between words becomes an em dash"
COM_WMARKA_REDKOLLEGIYA_CONFIG_EN_DASH_DESC="«Нацбанк – регулятор» → «Нацбанк — регулятор». An en dash between numbers («2 – 1») is left alone."
COM_WMARKA_REDKOLLEGIYA_CONFIG_RUBLE="Rouble as a sign"
COM_WMARKA_REDKOLLEGIYA_CONFIG_RUBLE_DESC="«5 руб.» → «5 ₽»."
COM_WMARKA_REDKOLLEGIYA_CONFIG_ISO="ISO dates in Russian form"
COM_WMARKA_REDKOLLEGIYA_CONFIG_ISO_DESC="«2026-11-06» → «06.11.2026». Off by default: such dates are often intentional, in file names and links."

COM_WMARKA_REDKOLLEGIYA_CONFIG_KK="Kazakh text"
COM_WMARKA_REDKOLLEGIYA_CONFIG_KK_DESC="Based on kk_typo from the Kazakh Redkollegiya (Altynsarin layer): rules Y01–Y14, settled by the usage of a corpus of Kazakh texts."
COM_WMARKA_REDKOLLEGIYA_CONFIG_NUMERO="Number sign"
COM_WMARKA_REDKOLLEGIYA_CONFIG_NUMERO_DESC="«№5» joined or «№ 5» with a no-break space."
COM_WMARKA_REDKOLLEGIYA_CONFIG_NUMERO_SLIT="Joined: №5"
COM_WMARKA_REDKOLLEGIYA_CONFIG_NUMERO_NBSP="No-break space: № 5"
COM_WMARKA_REDKOLLEGIYA_CONFIG_DEGREE="Degrees"
COM_WMARKA_REDKOLLEGIYA_CONFIG_DEGREE_DESC="«20°C» joined or «20 °C» with a no-break space."
COM_WMARKA_REDKOLLEGIYA_CONFIG_DEGREE_SLIT="Joined: 20°C"
COM_WMARKA_REDKOLLEGIYA_CONFIG_DEGREE_NBSP="No-break space: 20 °C"
COM_WMARKA_REDKOLLEGIYA_CONFIG_KK_DASH="Dash between words"
COM_WMARKA_REDKOLLEGIYA_CONFIG_KK_DASH_DESC="A hyphen, an en dash or «--» between words becomes an em dash."
COM_WMARKA_REDKOLLEGIYA_CONFIG_KK_DASH_EM="Em dash «—»"
COM_WMARKA_REDKOLLEGIYA_CONFIG_KK_DASH_KEEP="As written"

COM_WMARKA_REDKOLLEGIYA_CONFIG_HOUSE="House rules"
COM_WMARKA_REDKOLLEGIYA_CONFIG_HOUSE_DESC="For Russian and Kazakh text. Milchin does not set the minus sign or the decimal comma: in general a hyphen cannot be told from a minus, nor a dot from a version or a date. Here they are set only where there can be no mistake."
COM_WMARKA_REDKOLLEGIYA_CONFIG_MINUS="Minus sign"
COM_WMARKA_REDKOLLEGIYA_CONFIG_MINUS_DESC="A hyphen or en dash before a number becomes «−»: «-0,25 п. п.» → «−0,25 п. п.». Only after the start of a line, a space, a bracket or a quote, and only if the previous word is not a number: «5 -3» and phone numbers are left alone."
COM_WMARKA_REDKOLLEGIYA_CONFIG_DECIMAL="Decimal comma"
COM_WMARKA_REDKOLLEGIYA_CONFIG_DECIMAL_DESC="«1.5 млрд» → «1,5 млрд», «16.5%» → «16,5%», «в 2.5 раза» → «в 2,5 раза»: only before a unit, a percent sign, a currency or the word «раз». «Joomla 6.2», «п. 3.2», «06.11.2026» are left alone."
COM_WMARKA_REDKOLLEGIYA_CONFIG_MLN="«млн», «млрд» without a dot"
COM_WMARKA_REDKOLLEGIYA_CONFIG_MLN_DESC="«5 млн. тенге» → «5 млн тенге». At the end of a sentence the dot stays: there it ends the sentence as well."
COM_WMARKA_REDKOLLEGIYA_CONFIG_RANGE="Dash in a number range"
COM_WMARKA_REDKOLLEGIYA_CONFIG_RANGE_DESC="«2020–2025», «10–15 мая»: an en dash without spaces follows Milchin and kk_typo; an em dash is the older typesetting habit."
COM_WMARKA_REDKOLLEGIYA_CONFIG_RANGE_EN="En dash: 2020–2025"
COM_WMARKA_REDKOLLEGIYA_CONFIG_RANGE_EM="Em dash: 2020—2025"
COM_WMARKA_REDKOLLEGIYA_CONFIG_CURRENCY="₸ and $ before the number"
COM_WMARKA_REDKOLLEGIYA_CONFIG_CURRENCY_DESC="News style: «500 ₸» → «₸500», «5,2 млрд $» → «$5,2 млрд». Off: the sign stays where the author put it. Either way a sign before a number is joined to it: «₸ 8,5 млрд» → «₸8,5 млрд»."
COM_WMARKA_REDKOLLEGIYA_CONFIG_UNITS="Units after a number"
COM_WMARKA_REDKOLLEGIYA_CONFIG_UNITS_DESC="Separated by spaces. A no-break space goes between a number and such a unit. Kilograms, kilometres, «млн», «тыс.» and other units are handled by Milchin."

COM_WMARKA_REDKOLLEGIYA_CONFIG_YO="The letter ё"
COM_WMARKA_REDKOLLEGIYA_CONFIG_YO_DESC="The eyo dictionary by Denis Seleznev: only words where «е» in place of «ё» never happens («ещё», «её», «счёт»). Ambiguous words («все — всё») are left alone. Russian text only."
COM_WMARKA_REDKOLLEGIYA_CONFIG_YO_MODE="What to do with ё"
COM_WMARKA_REDKOLLEGIYA_CONFIG_YO_MODE_DESC="Restore from the reliable dictionary; remove, for publications that write without ё; or leave as written."
COM_WMARKA_REDKOLLEGIYA_CONFIG_YO_RESTORE="Restore from the dictionary"
COM_WMARKA_REDKOLLEGIYA_CONFIG_YO_REMOVE="Remove: «е» everywhere"
COM_WMARKA_REDKOLLEGIYA_CONFIG_YO_OFF="Leave as written"
COM_WMARKA_REDKOLLEGIYA_CONFIG_YO_NAMES="In proper names too"
COM_WMARKA_REDKOLLEGIYA_CONFIG_YO_NAMES_DESC="«Артем» → «Артём». Off by default: names are written as in the person's documents."

COM_WMARKA_REDKOLLEGIYA_CONFIG_PROTECT="Leave alone"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROTECT_DESC="Words no rule may touch: company names, surnames, signs inside brand names. Site extensions can add more words, such as a publication's glossary (event onWmarkaRedkollegiyaWords). Plugin calls like {loadmoduleid 5}, code and links are always protected."
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROTECT_WORDS="Words"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROTECT_WORDS_DESC="One per line, as written in the text. Matched as whole words, case-sensitive."

COM_WMARKA_REDKOLLEGIYA_CONFIG_SAVE="On save"
COM_WMARKA_REDKOLLEGIYA_CONFIG_SAVE_DESC="What the typograph covers by itself when an article is saved (while the plugin «Content - Webmarka Redkollegiya» is enabled). It runs last, after text cleaning; Joomla builds the article alias from the title earlier, so quotes and dashes never get into it."
COM_WMARKA_REDKOLLEGIYA_CONFIG_SAVE_TEXT="Article text"
COM_WMARKA_REDKOLLEGIYA_CONFIG_SAVE_TITLE="Title"
COM_WMARKA_REDKOLLEGIYA_CONFIG_SAVE_METADESC="Meta description"
COM_WMARKA_REDKOLLEGIYA_CONFIG_SAVE_IMAGES="Image captions and alternative text"

COM_WMARKA_REDKOLLEGIYA_CONFIG_JOURNAL="Journal"
COM_WMARKA_REDKOLLEGIYA_CONFIG_JOURNAL_DESC="Who ran the typograph, when, on which article, and how many changes each rule made. The texts themselves are not stored."
COM_WMARKA_REDKOLLEGIYA_CONFIG_JOURNAL_ON="Keep a journal"
COM_WMARKA_REDKOLLEGIYA_CONFIG_JOURNAL_DAYS="Keep for, days"
