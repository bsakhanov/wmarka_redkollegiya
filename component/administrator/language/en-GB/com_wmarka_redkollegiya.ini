COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_KK_PARITY_DESC="Valikhanov: if a Kazakh article is associated with a Russian one (Associations tab), proofreading compares paragraphs — numbers, dates, scale words, Latin names and terms. A changed number is an error that blocks publishing. The association is taken from the saved article."
