COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_KK_GLOSSARY_DESC="Shakarim: Kazakh abbreviations instead of Russian ones; banned forms and corpus-usage forms. The glossary is the Kazakh Redkollegiya example built from an oil and gas company corpus."
