COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_KK_DESC="Kazakh Redkollegiya: look-alike Latin and foreign letters (Altynsarin), extra marks, empty brackets, lowercase after a full stop, a number with an affix and no hyphen, currency in two forms (Baitursynov). No letter restoration: it needs a character model trained on a closed corpus."
