COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_KK_GLOSSARY_DESC="Шакарим: «ҚР», «ЖШС», «АҚ», «ЖК» вместо русских сокращений; формы под запретом и формы по узусу корпуса («жоба», а не «проект»). Глоссарий — пример из казахской Редколлегии, собранный по корпусу нефтегазовой компании."
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_KK_PARITY="Казахский текст: сверка с русским оригиналом"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_KK_PARITY_DESC="Валиханов: если у казахского материала есть связь с русским (вкладка «Связи»), вычитка сверяет абзацы — числа, даты, «мың / млн / млрд», латинские имена и термины. Изменённое число — ошибка, публиковать нельзя. Связь берётся из сохранённого материала."
