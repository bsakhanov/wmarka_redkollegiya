COM_WMARKA_REDKOLLEGIYA_SOURCE_PROOF="вычитка"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF="Вычитка"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_DESC="Кнопка «Вычитка» в редакторе показывает находки, а вносит только принятые — по месту и дословной цитате. Только механическая часть слоёв русской Редколлегии: то, что проверяется поиском и счётом. Смысл, запятые в обособлениях и факты — дело модели и редактора. Токены ИИ не тратятся."
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_SLOP="Следы нейросетей и клише"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_SLOP_DESC="Слопотрон: следы чат-ботов (служебные ссылки, рамки ответа «Конечно, вот…»), фразы-клише и стая маркеров в абзаце."
