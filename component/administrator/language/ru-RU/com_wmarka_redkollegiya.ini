COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_SLOP_WORDS_DESC="«Ключевой», «значительный», «экосистема», «инновационный»… Слопотрон не применяет их к новостям, науке и юридическому тексту: там это норма жанра."
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_SLOP_WORDS_EXCEPT_NEWS="Кроме рубрик новостей"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_SLOP_WORDS_ALWAYS="Во всех материалах"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_SLOP_WORDS_NEVER="Не проверять"
COM_WMARKA_REDKOLLEGIYA_CONFIG_NEWS_CATEGORIES="Рубрики новостей"
COM_WMARKA_REDKOLLEGIYA_CONFIG_NEWS_CATEGORIES_DESC="В материалах этих рубрик слова-маркеры не проверяются. Рубрика берётся из поля «Категория» материала."
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_KANC="Канцелярит"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_KANC_DESC="Проход А «Методологии языкового прогона» и Чуковский: «является», «данный», «позволяет», «осуществлять», «в рамках», «представляет собой», «уделять внимание». Где правка однозначна («данный» → «этот», «позволяет снизить» → «даёт снизить»), она предложена. Внутри цитат «…» не проверяется: слова говорящего не правят."
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_ROZENTAL="Норма по закрытым спискам"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_ROZENTAL_DESC="Розенталь: «согласно приказа» → «согласно приказу», «в течении года» → «в течение года», «по окончанию» → «по окончании», «не смотря на», «вследствии», «оплатить за», удвоенные слова."
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_RHYTHM="Ритм"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_RHYTHM_DESC="Пять и больше предложений почти одной длины подряд (разброс меньше трёх слов) — однообразный ритм: признак машинного текста и усталого читателя."
