COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_KK_DESC="Казахская Редколлегия: двойники латиницы и чужие буквы (Алтынсарин), лишние знаки, пустые скобки, строчная после точки, число с аффиксом без дефиса, валюта двумя видами (Байтурсынов)."
