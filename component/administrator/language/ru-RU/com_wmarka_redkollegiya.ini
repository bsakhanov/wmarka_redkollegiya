COM_WMARKA_REDKOLLEGIYA_CONFIG_RU="Русский текст"
COM_WMARKA_REDKOLLEGIYA_CONFIG_RU_DESC="Основа — типограф «Мильчин»: только правила, где верный ответ не зависит от смысла фразы. Здесь — спорные места, где издания пишут по-разному."
COM_WMARKA_REDKOLLEGIYA_CONFIG_PERCENT="Знак процента"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PERCENT_DESC="«10%» слитно — так пишет большинство деловых изданий; «10 %» через неразрывный пробел — по ГОСТ и справочнику Мильчина для научных текстов."
COM_WMARKA_REDKOLLEGIYA_CONFIG_PERCENT_SLIT="Слитно: 10%"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PERCENT_NBSP="Через неразрывный пробел: 10 %"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PREP="Предлоги и союзы"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PREP_DESC="Неразрывный пробел держит короткое слово на одной строке со следующим: «в Астане», «и банк». Однобуквенные — правило Мильчина; с двух- и трёхбуквенными («на», «для», «при») строки ровнее, но текст плотнее."
COM_WMARKA_REDKOLLEGIYA_CONFIG_PREP_ONE="Однобуквенные: в, к, с, у, о, и, а, я"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PREP_SHORT="И двух-, трёхбуквенные: на, по, для, при…; частицы же, ли, бы"
COM_WMARKA_REDKOLLEGIYA_CONFIG_INITIALS="Инициалы"
COM_WMARKA_REDKOLLEGIYA_CONFIG_INITIALS_DESC="«А. С. Пушкин» с неразрывными пробелами: инициалы не отрываются от фамилии. «Как есть» — типограф инициалы не трогает."
COM_WMARKA_REDKOLLEGIYA_CONFIG_INITIALS_NBSP="А. С. Пушкин, с неразрывными пробелами"
COM_WMARKA_REDKOLLEGIYA_CONFIG_INITIALS_KEEP="Как написал автор"
COM_WMARKA_REDKOLLEGIYA_CONFIG_EN_DASH="Короткое тире между словами — длинное"
COM_WMARKA_REDKOLLEGIYA_CONFIG_EN_DASH_DESC="«Нацбанк – регулятор» → «Нацбанк — регулятор». Короткое тире между числами («2 – 1») не трогается."
COM_WMARKA_REDKOLLEGIYA_CONFIG_RUBLE="Рубль знаком"
COM_WMARKA_REDKOLLEGIYA_CONFIG_RUBLE_DESC="«5 руб.» → «5 ₽»."
COM_WMARKA_REDKOLLEGIYA_CONFIG_ISO="Даты ISO по-русски"
COM_WMARKA_REDKOLLEGIYA_CONFIG_ISO_DESC="«2026-11-06» → «06.11.2026». Выключено по умолчанию: такие даты бывают нарочно — в именах файлов и ссылках."

COM_WMARKA_REDKOLLEGIYA_CONFIG_KK="Казахский текст"
COM_WMARKA_REDKOLLEGIYA_CONFIG_KK_DESC="Основа — типограф kk_typo из казахской Редколлегии (слой Алтынсарина): правила Y01–Y14, решённые по обычаю корпуса казахских текстов."
COM_WMARKA_REDKOLLEGIYA_CONFIG_NUMERO="Знак номера"
COM_WMARKA_REDKOLLEGIYA_CONFIG_NUMERO_DESC="«№5» слитно или «№ 5» через неразрывный пробел."
COM_WMARKA_REDKOLLEGIYA_CONFIG_NUMERO_SLIT="Слитно: №5"
COM_WMARKA_REDKOLLEGIYA_CONFIG_NUMERO_NBSP="Через неразрывный пробел: № 5"
COM_WMARKA_REDKOLLEGIYA_CONFIG_DEGREE="Градусы"
COM_WMARKA_REDKOLLEGIYA_CONFIG_DEGREE_DESC="«20°C» слитно или «20 °C» через неразрывный пробел."
COM_WMARKA_REDKOLLEGIYA_CONFIG_DEGREE_SLIT="Слитно: 20°C"
COM_WMARKA_REDKOLLEGIYA_CONFIG_DEGREE_NBSP="Через неразрывный пробел: 20 °C"
COM_WMARKA_REDKOLLEGIYA_CONFIG_KK_DASH="Тире между словами"
COM_WMARKA_REDKOLLEGIYA_CONFIG_KK_DASH_DESC="Дефис, короткое тире и «--» между словами становятся длинным тире."
COM_WMARKA_REDKOLLEGIYA_CONFIG_KK_DASH_EM="Длинное тире «—»"
COM_WMARKA_REDKOLLEGIYA_CONFIG_KK_DASH_KEEP="Как написал автор"

COM_WMARKA_REDKOLLEGIYA_CONFIG_HOUSE="Правила издания"
COM_WMARKA_REDKOLLEGIYA_CONFIG_HOUSE_DESC="Для русского и казахского текста. Мильчин минус и десятичную запятую не ставит: в общем виде дефис не отличить от минуса, а точку — от версии или даты. Здесь они ставятся только там, где ошибки быть не может."
COM_WMARKA_REDKOLLEGIYA_CONFIG_MINUS="Минус"
COM_WMARKA_REDKOLLEGIYA_CONFIG_MINUS_DESC="Дефис или короткое тире перед числом становится знаком минуса «−»: «-0,25 п. п.» → «−0,25 п. п.». Только если слева начало строки, пробел, скобка или кавычка, а предыдущее слово — не число: «5 -3» и телефоны не трогаются."
COM_WMARKA_REDKOLLEGIYA_CONFIG_DECIMAL="Десятичная запятая"
COM_WMARKA_REDKOLLEGIYA_CONFIG_DECIMAL_DESC="«1.5 млрд» → «1,5 млрд», «16.5%» → «16,5%», «в 2.5 раза» → «в 2,5 раза» — только перед единицей, процентом, валютой или словом «раз». «Joomla 6.2», «п. 3.2», «06.11.2026» не трогаются."
COM_WMARKA_REDKOLLEGIYA_CONFIG_MLN="«млн», «млрд» без точки"
COM_WMARKA_REDKOLLEGIYA_CONFIG_MLN_DESC="«5 млн. тенге» → «5 млн тенге». В конце предложения точка остаётся: она там и точка сокращения, и конец фразы."
COM_WMARKA_REDKOLLEGIYA_CONFIG_RANGE="Тире в диапазоне чисел"
COM_WMARKA_REDKOLLEGIYA_CONFIG_RANGE_DESC="«2020–2025», «10–15 мая»: короткое тире без пробелов — правило Мильчина и kk_typo; длинное — старый наборный обычай."
COM_WMARKA_REDKOLLEGIYA_CONFIG_RANGE_EN="Короткое: 2020–2025"
COM_WMARKA_REDKOLLEGIYA_CONFIG_RANGE_EM="Длинное: 2020—2025"
COM_WMARKA_REDKOLLEGIYA_CONFIG_CURRENCY="Знак ₸ и $ — перед числом"
COM_WMARKA_REDKOLLEGIYA_CONFIG_CURRENCY_DESC="Новостной стиль: «500 ₸» → «₸500», «5,2 млрд $» → «$5,2 млрд». Выключено — знак остаётся, где его поставил автор. В любом случае знак перед числом пишется слитно: «₸ 8,5 млрд» → «₸8,5 млрд»."
COM_WMARKA_REDKOLLEGIYA_CONFIG_UNITS="Единицы после числа"
COM_WMARKA_REDKOLLEGIYA_CONFIG_UNITS_DESC="Через пробел. Между числом и такой единицей ставится неразрывный пробел: «500 тенге», «3 баррелей». Килограммы, километры, «млн», «тыс.» и прочие единицы Мильчин привязывает сам."

COM_WMARKA_REDKOLLEGIYA_CONFIG_YO="Буква ё"
COM_WMARKA_REDKOLLEGIYA_CONFIG_YO_DESC="Словарь eyo Дениса Селезнёва: только слова, где «е» вместо «ё» не бывает («ещё», «её», «счёт», «причинённый»). «Все — всё», «небо — нёбо» и прочие двоякие слова не трогаются. Только в русском тексте."
COM_WMARKA_REDKOLLEGIYA_CONFIG_YO_MODE="Что делать с ё"
COM_WMARKA_REDKOLLEGIYA_CONFIG_YO_MODE_DESC="Восстанавливать — по надёжному словарю; снимать — для изданий, которые пишут без ё; не трогать — как написал автор."
COM_WMARKA_REDKOLLEGIYA_CONFIG_YO_RESTORE="Восстанавливать по словарю"
COM_WMARKA_REDKOLLEGIYA_CONFIG_YO_REMOVE="Снимать: всюду «е»"
COM_WMARKA_REDKOLLEGIYA_CONFIG_YO_OFF="Не трогать"
COM_WMARKA_REDKOLLEGIYA_CONFIG_YO_NAMES="И в именах собственных"
COM_WMARKA_REDKOLLEGIYA_CONFIG_YO_NAMES_DESC="«Артем» → «Артём», «Семенов» → «Семёнов». Выключено по умолчанию: фамилию и имя пишут так, как в документах человека."

COM_WMARKA_REDKOLLEGIYA_CONFIG_PROTECT="Не трогать"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROTECT_DESC="Слова, которые не правит ни одно правило: названия компаний, фамилии, знаки в именах брендов. Ещё слова могут дать расширения сайта — например, словарь терминов издания (событие onWmarkaRedkollegiyaWords). Вызовы плагинов вида {loadmoduleid 5}, код и ссылки защищены всегда."
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROTECT_WORDS="Слова"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROTECT_WORDS_DESC="По одному на строку, как пишутся в тексте: «Федоров», «Ежов-банк». Совпадение — целым словом, с учётом регистра."

COM_WMARKA_REDKOLLEGIYA_CONFIG_SAVE="При сохранении"
COM_WMARKA_REDKOLLEGIYA_CONFIG_SAVE_DESC="Что типограф проходит сам, когда материал сохраняют (работает, пока включён плагин «Содержимое - Webmarka Редколлегия»). Типограф идёт последним — после очистки текста; адрес материала Joomla строит из заголовка раньше, «ёлочки» и тире в него не попадают."
COM_WMARKA_REDKOLLEGIYA_CONFIG_SAVE_TEXT="Текст материала"
COM_WMARKA_REDKOLLEGIYA_CONFIG_SAVE_TITLE="Заголовок"
COM_WMARKA_REDKOLLEGIYA_CONFIG_SAVE_METADESC="Метаописание"
COM_WMARKA_REDKOLLEGIYA_CONFIG_SAVE_IMAGES="Подписи и альтернативный текст снимков"

COM_WMARKA_REDKOLLEGIYA_CONFIG_JOURNAL="Журнал"
COM_WMARKA_REDKOLLEGIYA_CONFIG_JOURNAL_DESC="Кто, когда и в каком материале прогнал типограф и сколько правок вышло по каким правилам. Сами тексты в журнал не пишутся."
COM_WMARKA_REDKOLLEGIYA_CONFIG_JOURNAL_ON="Вести журнал"
COM_WMARKA_REDKOLLEGIYA_CONFIG_JOURNAL_DAYS="Хранить, дней"
COM_WMARKA_REDKOLLEGIYA_LAYER_SLOP="Следы нейросетей и клише (Слопотрон)"
COM_WMARKA_REDKOLLEGIYA_LAYER_CHUKOVSKY="Канцелярит и ритм (Чуковский, методология)"
COM_WMARKA_REDKOLLEGIYA_LAYER_ROZENTAL="Норма (Розенталь)"
COM_WMARKA_REDKOLLEGIYA_LAYER_YO="Буква «ё»"
COM_WMARKA_REDKOLLEGIYA_PROOF_S_CITE="След чат-бота: служебная ссылка на источник (ChatGPT, Gemini, Grok, DeepSeek, Perplexity). Человек такого не печатает — убрать."
COM_WMARKA_REDKOLLEGIYA_PROOF_S_TOKEN="Служебный знак языковой модели, протёкший при копировании, — убрать."
COM_WMARKA_REDKOLLEGIYA_PROOF_S_PUA="Невидимый знак-обёртка цитаты чат-бота — убрать."
COM_WMARKA_REDKOLLEGIYA_PROOF_S_ENT="Запись HTML вместо знака — несработавший перенос из чата. Заменить знаком."
COM_WMARKA_REDKOLLEGIYA_PROOF_S_FRAME="Рамка ответа чат-бота («Конечно, вот…», «Надеюсь, было полезно») — остаток диалога, а не текст статьи."
COM_WMARKA_REDKOLLEGIYA_PROOF_S_SMM="Призыв из соцсетей («делитесь в комментариях», «ставьте реакцию») — в статье, скорее всего, лишний."
COM_WMARKA_REDKOLLEGIYA_PROOF_S_PHR="Клише нейросети (Слопотрон). Одиночное — не беда; беда, когда рядом другие."
COM_WMARKA_REDKOLLEGIYA_PROOF_S_WORD="Слово-маркер нейросети (Слопотрон): пустой усилитель или канцелярит. Одно — не беда, три в абзаце — стая."
COM_WMARKA_REDKOLLEGIYA_PROOF_S_CLUSTER="В абзаце %d маркеров канцелярита и клише — это уже стая (Слопотрон). Перепишите абзац целиком, а не по словам."
COM_WMARKA_REDKOLLEGIYA_PROOF_K_YAVL="«Является» — канцелярская связка: «есть», тире или прямой глагол."
COM_WMARKA_REDKOLLEGIYA_PROOF_K_DANN="«Данный» — канцелярит: «этот»."
COM_WMARKA_REDKOLLEGIYA_PROOF_K_POZV="«Позволяет» — канцелярит: «даёт» или прямой глагол."
COM_WMARKA_REDKOLLEGIYA_PROOF_K_OSUSH="«Осуществлять» — канцелярит: назовите действие прямо — делать, вести, строить."
COM_WMARKA_REDKOLLEGIYA_PROOF_K_RAMK="«В рамках», «в контексте», «в свете» — калька: скажите проще («на», «по», «при») или перестройте фразу."
COM_WMARKA_REDKOLLEGIYA_PROOF_K_PREDST="«Представляет собой», «выступает в роли», «характеризуется» — канцелярит: простой глагол или тире."
COM_WMARKA_REDKOLLEGIYA_PROOF_K_UDEL="«Уделять внимание» — канцелярит: прямой глагол («изучать», «следить»)."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_SOGL="«Согласно», «благодаря», «вопреки» требуют дательного падежа: согласно приказу."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_TECH="О времени — «в течение» (года, месяца); «в течении» — о течении реки."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_VVIDU="Предлог «ввиду» («из-за») пишется слитно; «в виду» — только в «иметь в виду»."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_NESM="Предлог «несмотря на» пишется слитно."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_PO="«По» в значении «после» — с предложным падежом: по окончании, по приезде, по завершении."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_VSLED="Предлог «вследствие» («из-за») кончается на «е»."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_OPLAT="Оплатить что — без «за»; заплатить за что."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_DOUBLE="Слово повторено дважды подряд — вероятно, опечатка."
COM_WMARKA_REDKOLLEGIYA_PROOF_Y_VSE="Здесь «всё»: всё равно, всё ещё, всё больше."
COM_WMARKA_REDKOLLEGIYA_PROOF_Y_NEM="Здесь «нём»: о нём, в нём, на нём."
COM_WMARKA_REDKOLLEGIYA_PROOF_Y_OBEM="«Объём» — с «ё»; без неё это форма глагола «объесть»."
COM_WMARKA_REDKOLLEGIYA_PROOF_Y_SCHET="«Счёт» — с «ё»: за счёт, на счёт."
