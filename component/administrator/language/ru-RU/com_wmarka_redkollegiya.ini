COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_KK_RESTORE="Казахский текст: восстановление букв"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_KK_RESTORE_DESC="S01 казахской Редколлегии: слово, набранное без казахских букв («Казакстан», «укиметі»), получает подсказку («Қазақстан», «үкіметі»). Символьная модель обучена на открытом корпусе KazNERD (ISSAI, CC BY 4.0); на его проверочных частях верны 99,5% подсказок при полноте 83%. Подсказки только предлагаются — решает читающий по-казахски."
