COM_WMARKA_REDKOLLEGIYA_PROOF_R_TIME_REL="«Сегодня», «вчера», «завтра» и подобное: материал прочтут и через месяц. Укажите дату."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_VHODE="«В ходе» не употребляем: «на брифинге» или «во время брифинга»."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_OZVUCH="«Озвучил» — канцелярит: «сказал», «назвал», «объявил»."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_PLOSCH="«На площадке» лишнее: «сказали в СЦК», а не «было озвучено на площадке СЦК»."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_PASSIVE="Страдательный залог: кто это сделал? «Храм воздвигли», «мы утвердили» — так, и в прямой речи чиновников тоже."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_DR="«И др.» пишем полностью: «и другие» или «и другое»."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_NAPOMNIM="Вместо «напомним» лучше дата события: «15 января … уже поднимал вопрос». Если без него не обойтись — без гиперссылки на нём."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_SOC="Соцсети и мессенджеры — латиницей: Facebook, Instagram, WhatsApp, X, Telegram. И гиперссылка на пост, о котором пишем."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_INET="«Интернет» — с прописной."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_POST="Должности — со строчной: президент, глава государства, премьер-министр, министр, аким."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_AKIMAT="Акиматы и маслихаты — со строчной."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_CITY="Город — только названием, без слова «город»: «в Берлине», а не «в городе Берлине». В прямой речи — как сказал спикер."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_BRAND="Названия техники и марок — в оригинале, без кавычек: Mazda, Ferrari."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_MLN="В тексте «млн», «млрд», «тыс.» пишем полностью, в цитатах тоже (в заголовке можно сократить). Форма подобрана по числу и предлогу — проверьте падеж."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_UNIT="Единицы измерения не сокращаем: «километров», «тонн», «минут». Форма подобрана по числу и предлогу — проверьте падеж."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_ADDR="Адресные слова — полностью: «улица», «проспект», «микрорайон». Форма подобрана по предлогу — проверьте падеж."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_LEAD="Лид — первый абзац — выделяется жирным (Ctrl+B)."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_LEAD_CREDIT="Фразу «передает сайт» в лиде жирным не выделяем."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_SITELINK="Название сайта при первом упоминании — гиперссылкой."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_NAPOMNIM_LINK="Гиперссылку на слово «напомним» не ставим — ставим на точные глаголы и фразы."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_PHOTO="У изображения нет подписи с источником через двоеточие: «Фото: pixabay.com»."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_H1="H1 в тексте статьи не нужен: на странице он один — заголовок материала. Подзаголовки — H2 и H3."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_HSKIP="Пропущен уровень заголовка: после H2 идёт H3, а не H4."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_QUOTES2="Две цитаты подряд — моветон: разбейте их пересказом или фактом."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_QUOTE_END="Текст кончается цитатой: нужно внятное завершение."
COM_WMARKA_REDKOLLEGIYA_PROOF_T_LEN="Заголовок длиннее 80 знаков (%1$s): золотая середина — 60–70, около шести слов."
COM_WMARKA_REDKOLLEGIYA_PROOF_T_QUOTES="Кавычки в заголовке не пишем: перестройте заголовок без них."
COM_WMARKA_REDKOLLEGIYA_PROOF_T_REL="«Сегодня», «вчера», «завтра» в заголовке недопустимы: укажите дату."
COM_WMARKA_REDKOLLEGIYA_PROOF_T_CITY="Слово «город» в заголовке лишнее: только название."
COM_WMARKA_REDKOLLEGIYA_CONFIG_NESTED="Кавычки внутри кавычек"
COM_WMARKA_REDKOLLEGIYA_CONFIG_NESTED_DESC="„Лапки“ внутри «ёлочек» — правило Мильчина; только «ёлочки» — правило изданий, которые лапок не ставят: «Компания «Самрук»»."
COM_WMARKA_REDKOLLEGIYA_CONFIG_NESTED_LDQUO="„Лапки“ внутри «ёлочек»"
COM_WMARKA_REDKOLLEGIYA_CONFIG_NESTED_GUILLEMETS="Только «ёлочки»"
COM_WMARKA_REDKOLLEGIYA_CONFIG_EXPAND="«и т. д.», «т. е.» полностью"
COM_WMARKA_REDKOLLEGIYA_CONFIG_EXPAND_DESC="«и т. д.» → «и так далее», «и т. п.» → «и тому подобное», «т. е.» → «то есть», «в т. ч.» → «в том числе». «И др.» — в вычитке: «и другие» или «и другое» решает редактор."
COM_WMARKA_REDKOLLEGIYA_CONFIG_TIME="Время через двоеточие"
COM_WMARKA_REDKOLLEGIYA_CONFIG_TIME_DESC="«в 15.00», «с 9.00 до 18.00», «15-00 часов» → «15:00». Только после «в», «с», «до», «к», «около», «после», «от»; «12.05» без слова «часов» похоже на дату и не трогается."
COM_WMARKA_REDKOLLEGIYA_CONFIG_THOUSANDS="Разряды пробелом"
COM_WMARKA_REDKOLLEGIYA_CONFIG_THOUSANDS_DESC="«56347» → «56 347» (неразрывный пробел). Номера, телефоны, ИИН и БИН, индексы и числа с нулём впереди не трогаются."
COM_WMARKA_REDKOLLEGIYA_CONFIG_THOUSANDS_5="С пяти цифр: 56 347, а 1500 — слитно"
COM_WMARKA_REDKOLLEGIYA_CONFIG_THOUSANDS_4="С четырёх цифр: 1 500"
COM_WMARKA_REDKOLLEGIYA_CONFIG_THOUSANDS_0="Не трогать"
COM_WMARKA_REDKOLLEGIYA_CONFIG_SPEECH="Прямая речь: знаки"
COM_WMARKA_REDKOLLEGIYA_CONFIG_SPEECH_DESC="«Где деньги?», — спросил → «Где деньги?» — спросил; «Всё хорошо.» — ответил → «Всё хорошо», — ответил."
COM_WMARKA_REDKOLLEGIYA_CONFIG_LINKPUNCT="Знаки и пробелы — вне гиперссылки"
COM_WMARKA_REDKOLLEGIYA_CONFIG_LINKPUNCT_DESC="Точка, запятая и пробелы по краям ссылки выносятся за её пределы: в ссылке — ровно слова."
COM_WMARKA_REDKOLLEGIYA_CONFIG_NOH1="H1 в тексте — H2"
COM_WMARKA_REDKOLLEGIYA_CONFIG_NOH1_DESC="H1 на странице один — заголовок материала. Заголовок H1 в тексте (например, вставленный из Word) становится H2."
COM_WMARKA_REDKOLLEGIYA_CONFIG_HOUSE_RULES="Правила редакции"
COM_WMARKA_REDKOLLEGIYA_CONFIG_HOUSE_RULES_DESC="Правила новостного сайта, а не нормы языка: вычитка показывает находки, вносит только принятые. Всё выключено по умолчанию."
COM_WMARKA_REDKOLLEGIYA_CONFIG_HOUSE_TIME="Никаких «сегодня», «вчера», «завтра»"
COM_WMARKA_REDKOLLEGIYA_CONFIG_HOUSE_STYLE="Канцелярит редакции: «в ходе», «озвучил», «на площадке», страдательный залог, «и др.», «напомним»"
COM_WMARKA_REDKOLLEGIYA_CONFIG_HOUSE_NAMES="Названия: соцсети латиницей, «Интернет», должности и акиматы со строчной, без слова «город», марки без кавычек"
COM_WMARKA_REDKOLLEGIYA_CONFIG_HOUSE_UNITS="Полными словами: «млн», «тыс.», единицы измерения, адресные слова"
COM_WMARKA_REDKOLLEGIYA_CONFIG_HOUSE_STRUCT="Строение: лид жирным, сайт ссылкой, подпись у снимка, H1 и уровни заголовков, цитаты подряд и в конце"
COM_WMARKA_REDKOLLEGIYA_CONFIG_HOUSE_TITLE="Заголовок: до 80 знаков, без кавычек, без «сегодня», без слова «город»"
COM_WMARKA_REDKOLLEGIYA_CONFIG_SITE_NAME="Имя сайта"
COM_WMARKA_REDKOLLEGIYA_CONFIG_SITE_NAME_DESC="Как пишется в тексте, например the-tenge.kz: по нему проверяются лид («передает сайт» — не жирным) и первое упоминание сайта ссылкой. Пусто — адрес сайта."
