COM_WMARKA_REDKOLLEGIYA_PROOF_S_SMM="Әлеуметтік желі үндеуі («делитесь в комментариях») — мақалада артық болуы ықтимал."
COM_WMARKA_REDKOLLEGIYA_PROOF_S_PHR="Нейрожелі клишесі (Слопотрон). Жалғыз болса — ештеңе етпейді; қасында басқалары болса — проблема."
COM_WMARKA_REDKOLLEGIYA_PROOF_S_WORD="Нейрожелі маркер-сөзі (Слопотрон). Біреуі — ештеңе етпейді, абзацта үшеуі — топ."
COM_WMARKA_REDKOLLEGIYA_PROOF_S_CLUSTER="Абзацта кеңсе тілі мен клишенің %d маркері бар — бұл топ (Слопотрон). Абзацты сөз-сөзімен емес, тұтас қайта жазыңыз."
COM_WMARKA_REDKOLLEGIYA_PROOF_K_YAVL="«Является» — кеңсе тілі: «есть», сызықша немесе тура етістік."
COM_WMARKA_REDKOLLEGIYA_PROOF_K_DANN="«Данный» — кеңсе тілі: «этот»."
COM_WMARKA_REDKOLLEGIYA_PROOF_K_POZV="«Позволяет» — кеңсе тілі: «даёт» немесе тура етістік."
COM_WMARKA_REDKOLLEGIYA_PROOF_K_OSUSH="«Осуществлять» — кеңсе тілі: әрекетті тура атаңыз."
COM_WMARKA_REDKOLLEGIYA_PROOF_K_RAMK="«В рамках», «в контексте», «в свете» — калька: қарапайым айтыңыз немесе сөйлемді қайта құрыңыз."
COM_WMARKA_REDKOLLEGIYA_PROOF_K_PREDST="«Представляет собой», «выступает в роли», «характеризуется» — кеңсе тілі: қарапайым етістік немесе сызықша."
COM_WMARKA_REDKOLLEGIYA_PROOF_K_UDEL="«Уделять внимание» — кеңсе тілі: тура етістік."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_SOGL="«Согласно», «благодаря», «вопреки» барыс септігін талап етеді: согласно приказу."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_TECH="Уақыт туралы — «в течение» (года); «в течении» — өзеннің ағысы туралы."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_VVIDU="«Ввиду» («из-за») предлогы бірге жазылады; «в виду» — тек «иметь в виду» тіркесінде."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_NESM="«Несмотря на» предлогы бірге жазылады."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_PO="«После» мағынасындағы «по» — жатыс септікпен: по окончании, по приезде."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_VSLED="«Вследствие» («из-за») предлогы «е» әрпімен аяқталады."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_OPLAT="Оплатить что — «за»-сыз; заплатить за что."
COM_WMARKA_REDKOLLEGIYA_PROOF_R_DOUBLE="Сөз қатарынан екі рет қайталанған — қате теру болуы ықтимал."
COM_WMARKA_REDKOLLEGIYA_PROOF_Y_VSE="Мұнда «всё»: всё равно, всё ещё, всё больше."
COM_WMARKA_REDKOLLEGIYA_PROOF_Y_NEM="Мұнда «нём»: о нём, в нём, на нём."
COM_WMARKA_REDKOLLEGIYA_PROOF_Y_OBEM="«Объём» — «ё» әрпімен; онсыз бұл «объесть» етістігінің формасы."
COM_WMARKA_REDKOLLEGIYA_PROOF_Y_SCHET="«Счёт» — «ё» әрпімен: за счёт."
COM_WMARKA_REDKOLLEGIYA_PROOF_RH_MONO="Ырғақ біркелкі: ұзындығы бірдей дерлік %d сөйлем (айырмасы %s сөз). Ұзын және қысқа сөйлемдерді мағынаға қарай алмастырыңыз (Чуковский)."
COM_WMARKA_REDKOLLEGIYA_PROOF_OTHER_LANG="Тексеру орыс және қазақ мәтінімен жұмыс істейді; бұл материал басқа тілде."
