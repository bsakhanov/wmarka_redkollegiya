COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_KK_DESC="Қазақ Редколлегиясы: латын егіздері мен бөтен әріптер (Алтынсарин), артық белгілер, бос жақша, нүктеден кейінгі кіші әріп, дефиссіз жалғаулы сан, валютаның екі түрі (Байтұрсынов)."
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_KK_GLOSSARY="Қазақ мәтіні: глоссарий бойынша терминдер"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_KK_GLOSSARY_DESC="Шәкәрім: орыс қысқартуларының орнына «ҚР», «ЖШС», «АҚ», «ЖК»; тыйым салынған формалар және корпус қолданысындағы формалар («проект» емес, «жоба»). Глоссарий — қазақ Редколлегиясындағы мұнай-газ компаниясының корпусынан жиналған мысал."
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_KK_PARITY="Қазақ мәтіні: орыс түпнұсқасымен салыстыру"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_KK_PARITY_DESC="Уәлиханов: қазақ материалының орыс материалымен байланысы болса («Байланыстар» қойындысы), тексеру абзацтарды салыстырады — сандар, күндер, «мың / млн / млрд», латын атаулары мен терминдер. Өзгерген сан — қате, жариялауға болмайды. Байланыс сақталған материалдан алынады."
