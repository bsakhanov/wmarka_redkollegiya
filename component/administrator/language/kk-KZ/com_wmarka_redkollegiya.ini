COM_WMARKA_REDKOLLEGIYA_CONFIG_PERCENT="Пайыз белгісі"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PERCENT_DESC="«10%» бірге — іскери басылымдардың көбі осылай жазады; «10 %» үзілмейтін бос орынмен — ғылыми мәтіндерге арналған МемСТ пен Мильчин анықтамалығы бойынша."
