COM_WMARKA_REDKOLLEGIYA_CONFIG_SAVE="Сақтағанда"
COM_WMARKA_REDKOLLEGIYA_CONFIG_SAVE_DESC="Материал сақталғанда типограф өзі өткізетін бөліктер («Мазмұн - Webmarka Редколлегия» плагині қосулы тұрғанда). Типограф соңынан — мәтін тазартылғаннан кейін жүреді; материал адресін Joomla тақырыптан бұрынырақ құрады, тырнақша мен сызықша оған түспейді."
