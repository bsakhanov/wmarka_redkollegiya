COM_WMARKA_REDKOLLEGIYA_CONFIG_NEWS_CATEGORIES_DESC="Осы айдарлардың материалдарында маркер-сөздер тексерілмейді. Айдар материалдың «Санат» өрісінен алынады."
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_KANC="Кеңсе тілі"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_KANC_DESC="«Тілдік тексеру әдістемесінің» А өтуі мен Чуковский. Түзету бірмәнді болса, ұсынылады. «…» дәйексөз ішінде тексерілмейді: сөйлеушінің сөзі түзетілмейді."
