COM_WMARKA_REDKOLLEGIYA_PROOF_REMOVE="алып тастау"
COM_WMARKA_REDKOLLEGIYA_SOURCE_PROOF="тексеру"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF="Тексеру"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_DESC="Редактордағы «Тексеру» батырмасы табылымдарды көрсетеді, ал тек қабылданғандарын енгізеді — орны мен сөзбе-сөз дәйексөзі бойынша. Орыс Редколлегиясы қабаттарының тек механикалық бөлігі: іздеу мен санаумен тексерілетіні. Мағына, үтірлер және деректер — модель мен редактордың ісі. ЖИ токендері жұмсалмайды."
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROOF_SLOP="Нейрожелі іздері мен клишелер"
