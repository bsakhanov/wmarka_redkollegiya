COM_WMARKA_REDKOLLEGIYA_CONFIG_CURRENCY="₸ пен $ белгісі — сан алдында"
COM_WMARKA_REDKOLLEGIYA_CONFIG_CURRENCY_DESC="Жаңалық стилі: «500 ₸» → «₸500», «5,2 млрд $» → «$5,2 млрд». Өшірулі болса, белгі автор қойған жерде қалады. Қалай болғанда да сан алдындағы белгі бірге жазылады: «₸ 8,5 млрд» → «₸8,5 млрд»."
COM_WMARKA_REDKOLLEGIYA_CONFIG_UNITS="Саннан кейінгі өлшем бірліктері"
COM_WMARKA_REDKOLLEGIYA_CONFIG_UNITS_DESC="Бос орын арқылы. Сан мен мұндай бірлік арасына үзілмейтін бос орын қойылады. Килограмм, километр, «млн», «тыс.» сияқтыларды Мильчин өзі байлайды."

COM_WMARKA_REDKOLLEGIYA_CONFIG_YO="«Ё» әрпі"
COM_WMARKA_REDKOLLEGIYA_CONFIG_YO_DESC="Денис Селезнёвтің eyo сөздігі: тек «ё» орнына «е» болмайтын сөздер («ещё», «её», «счёт»). Екіұшты сөздер («все — всё») өзгермейді. Тек орыс мәтінінде."
