COM_WMARKA_REDKOLLEGIYA_CONFIG_YO_MODE_DESC="Сенімді сөздік бойынша қалпына келтіру; «ё»-сіз жазатын басылымдар үшін алып тастау; немесе автор жазғандай қалдыру."
