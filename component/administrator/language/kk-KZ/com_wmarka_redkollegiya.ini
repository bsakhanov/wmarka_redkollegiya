COM_WMARKA_REDKOLLEGIYA_CONFIG_DECIMAL_DESC="«1.5 млрд» → «1,5 млрд», «16.5%» → «16,5%», «2.5 есе» → «2,5 есе» — тек өлшем бірлігі, пайыз, валюта немесе «есе» сөзі алдында. «Joomla 6.2», «3.2-тармақ», «06.11.2026» өзгермейді."
COM_WMARKA_REDKOLLEGIYA_CONFIG_MLN="«млн», «млрд» нүктесіз"
COM_WMARKA_REDKOLLEGIYA_CONFIG_MLN_DESC="«5 млн. тенге» → «5 млн тенге». Сөйлем соңында нүкте қалады: онда ол сөйлемді де аяқтайды."
