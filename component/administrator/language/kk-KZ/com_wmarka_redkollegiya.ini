COM_WMARKA_REDKOLLEGIYA_CONFIG_PROTECT="Өзгертпеу"
COM_WMARKA_REDKOLLEGIYA_CONFIG_PROTECT_DESC="Ешбір ереже өзгертпейтін сөздер: компания атаулары, тектер, бренд атауларындағы белгілер. Сайт кеңейтімдері де сөз қоса алады — мысалы, басылымның терминдер сөздігі (onWmarkaRedkollegiyaWords оқиғасы). {loadmoduleid 5} сияқты плагин шақырулары, код және сілтемелер әрқашан қорғалған."
