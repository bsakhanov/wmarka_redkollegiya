COM_WMARKA_REDKOLLEGIYA_CONFIG_PREP_DESC="Үзілмейтін бос орын қысқа сөзді келесі сөзбен бір жолда ұстайды. Бір әріптілері — Мильчин ережесі; екі-үш әріптілерімен жолдар тегіс, бірақ мәтін тығыз."
