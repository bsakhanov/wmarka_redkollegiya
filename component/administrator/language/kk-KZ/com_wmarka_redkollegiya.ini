COM_WMARKA_REDKOLLEGIYA_CONFIG_UNITS_DESC="Бос орын арқылы. Сан мен мұндай бірлік арасына үзілмейтін бос орын қойылады. Килограмм, километр, «млн», «тыс.» сияқтыларды Мильчин өзі байлайды."

