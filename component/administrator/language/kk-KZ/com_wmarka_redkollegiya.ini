COM_WMARKA_REDKOLLEGIYA_CONFIG_HOUSE="Басылым ережелері"
COM_WMARKA_REDKOLLEGIYA_CONFIG_HOUSE_DESC="Орыс және қазақ мәтіні үшін. Мильчин минус пен ондық үтірді қоймайды: жалпы жағдайда дефисті минустан, нүктені нұсқа нөмірі мен күннен ажырату мүмкін емес. Мұнда олар қате болуы мүмкін емес жерде ғана қойылады."
COM_WMARKA_REDKOLLEGIYA_CONFIG_MINUS="Минус"
COM_WMARKA_REDKOLLEGIYA_CONFIG_MINUS_DESC="Сан алдындағы дефис немесе қысқа сызықша «−» минус белгісіне айналады: «-0,5%» → «−0,5%». Тек сол жағында жол басы, бос орын, жақша немесе тырнақша болса және алдыңғы сөз сан болмаса: «5 -3» пен телефон нөмірлері өзгермейді."
