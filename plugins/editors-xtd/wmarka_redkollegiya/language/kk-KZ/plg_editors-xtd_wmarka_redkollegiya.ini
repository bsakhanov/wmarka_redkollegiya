PLG_EDITORS-XTD_WMARKA_REDKOLLEGIYA="Батырма - Webmarka Редколлегия"
PLG_EDITORS-XTD_WMARKA_REDKOLLEGIYA_XML_DESCRIPTION="Материал редакторындағы «Типограф» батырмасы: «тырнақша», сызықша, минус, үзілмейтін бос орын, ондық үтір, «ё» әрпі — Webmarka Редколлегия компонентінің баптаулары бойынша. TinyMCE-де панельде де бар."
PLG_EDITORS-XTD_WMARKA_REDKOLLEGIYA_BUTTON="Типограф"
PLG_EDITORS-XTD_WMARKA_REDKOLLEGIYA_TOOLTIP="«Тырнақша», сызықша, минус, үзілмейтін бос орын және «ё» қою. Болдырмау — Ctrl+Z."
PLG_EDITORS-XTD_WMARKA_REDKOLLEGIYA_ERROR="Типограф жауап бермеді. Материалды сақтап, бетті жаңартып, қайта көріңіз."
PLG_EDITORS-XTD_WMARKA_REDKOLLEGIYA_CHANGED="Типограф жұмыс істеп жатқанда мәтін түзетілді, сондықтан оның жауабы қойылмады. «Типограф» батырмасын қайта басыңыз."
PLG_EDITORS-XTD_WMARKA_REDKOLLEGIYA_TOOLBAR="TinyMCE панеліндегі батырма"
PLG_EDITORS-XTD_WMARKA_REDKOLLEGIYA_TOOLBAR_DESC="«Мазмұн» мәзіріндегі тармақтан басқа — редактор панелінде «Типограф» батырмасы: екі басудың орнына бір басу. Редактор баптаулары өзгермейді."
PLG_EDITORS-XTD_WMARKA_REDKOLLEGIYA_PLACE="Панельдегі орны"
PLG_EDITORS-XTD_WMARKA_REDKOLLEGIYA_PLACE_DESC="Басында — «Мазмұн» мәзірінен кейін бірден, тар терезеде де көрінеді; соңында — барлық батырмалардан кейін."
